<!DOCTYPE html>
<html>
<head>
  <title>Calories Prediction</title>
  <style>
    body { font-family: Arial; background: #f5f5f5; padding: 30px; }
    .container { background: white; padding: 20px; max-width: 500px; margin: auto; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    label { font-weight: bold; margin-top: 10px; display: block; }
    input, select { width: 100%; padding: 8px; margin-top: 5px; border-radius: 5px; border: 1px solid #ccc; }
    button { margin-top: 15px; width: 100%; padding: 10px; background: #007BFF; color: white; border: none; border-radius: 5px; cursor: pointer; }
    button:hover { background: #0056b3; }
    .result { margin-top: 15px; font-size: 1.2em; }
    .error { color: red; }
  </style>
</head>
<body>
  <div class="container">
    <h2>Calories Prediction</h2>
    <form id="predictForm">
      {% for name in feature_names %}
        <label>{{ name }}</label>
        {% if name == "Sex" %}
          <select id="{{ name }}" name="{{ name }}">
            <option value="male">Male</option>
            <option value="female">Female</option>
          </select>
        {% else %}
          <input type="number" id="{{ name }}" name="{{ name }}" step="any" required>
        {% endif %}
      {% endfor %}
      <button type="submit">Predict</button>
    </form>
    <div class="result" id="output">Enter values and click Predict</div>
  </div>

  <script>
    document.getElementById("predictForm").addEventListener("submit", async function(e) {
      e.preventDefault();
      const formData = new FormData(e.target);
      const data = {};
      formData.forEach((value, key) => {
        const num = parseFloat(value);
        data[key] = isNaN(num) ? value : num;
      });

      try {
        const res = await fetch("/predict", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(data)
        });
        const json = await res.json();
        if (json.error) {
          document.getElementById("output").innerHTML = '<span class="error">' + json.error + '</span>';
        } else {
          document.getElementById("output").textContent = "Prediction: " + json.prediction;
        }
      } catch (err) {
        document.getElementById("output").innerHTML = '<span class="error">' + err + '</span>';
      }
    });
  </script>
</body>
</html>
